{# Shared filter bar for the ingest views. #}
<form method="GET" class="row g-2 align-items-end mb-3">
  <div class="col-md-3">
    <label class="form-label small text-muted mb-1">Search</label>
    <input type="text" name="q" value="{{ filters.q }}" class="form-control form-control-sm"
           placeholder="hostname, CVE, or product">
  </div>
  <div class="col-md-2">
    <label class="form-label small text-muted mb-1">Severity</label>
    <select name="severity" class="form-select form-select-sm">
      <option value="">All</option>
      {% for s in ['Critical','High','Medium','Low'] %}
        <option value="{{ s }}" {{ 'selected' if filters.severity|lower == s|lower }}>{{ s }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-2">
    <label class="form-label small text-muted mb-1">ExPRT.AI</label>
    <select name="exprt" class="form-select form-select-sm">
      <option value="">All</option>
      {% for s in ['Critical','High','Medium','Low'] %}
        <option value="{{ s }}" {{ 'selected' if filters.exprt|lower == s|lower }}>{{ s }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-2">
    <label class="form-label small text-muted mb-1">Triage state</label>
    <select name="state" class="form-select form-select-sm">
      <option value="">New + Triaged</option>
      {% for s in states %}
        <option value="{{ s }}" {{ 'selected' if filters.state == s }}>{{ s }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-3">
    <div class="form-check form-check-inline small">
      <input class="form-check-input" type="checkbox" name="kev" value="1" id="f-kev"
             {{ 'checked' if filters.kev }}>
      <label class="form-check-label" for="f-kev">CISA KEV only</label>
    </div>
    <div class="form-check form-check-inline small">
      <input class="form-check-input" type="checkbox" name="internet" value="1" id="f-net"
             {{ 'checked' if filters.internet }}>
      <label class="form-check-label" for="f-net">Internet-facing</label>
    </div>
    <div class="form-check form-check-inline small">
      <input class="form-check-input" type="checkbox" name="include_handled" value="1" id="f-handled"
             {{ 'checked' if filters.include_handled }}>
      <label class="form-check-label" for="f-handled">Include elevated/dismissed</label>
    </div>
    <div class="form-check form-check-inline small">
      <input class="form-check-input" type="checkbox" name="include_closed" value="1" id="f-closed"
             {{ 'checked' if filters.include_closed }}>
      <label class="form-check-label" for="f-closed">Include closed</label>
    </div>
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-sm btn-primary"><i class="bi bi-funnel"></i> Apply</button>
    <a href="{{ request.path }}" class="btn btn-sm btn-outline-secondary">Reset</a>
  </div>
</form>
