<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Skerry</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="alternate icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <meta name="theme-color" content="#1a2744">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #1a2744; min-height: 100vh; display: flex; align-items: center; }
    .login-card {
      max-width: 420px; width: 100%;
      margin: 0 auto;
      background: #fff;
      border-radius: 10px;
      padding: 2.5rem;
      box-shadow: 0 8px 32px rgba(0,0,0,.3);
    }
    .brand-label {
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: #6c757d;
    }
    .brand-title { font-weight: 700; font-size: 1.4rem; color: #1a2744; }
    .divider { border-top: 1px solid #dee2e6; margin: 1.25rem 0; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="text-center mb-4">
    <img src="{{ url_for('static', filename='brand/skerry-mark.svg') }}"
         width="56" height="56" alt="">
    <div class="brand-label mt-2">Cybersecurity</div>
    <div class="brand-title">Skerry</div>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="mb-3">
      <label for="username" class="form-label fw-semibold small">Username</label>
      <input type="text" class="form-control" id="username" name="username"
             placeholder="username" required autofocus autocomplete="username">
    </div>

    <div class="mb-3">
      <label for="password" class="form-label fw-semibold small">Password</label>
      <input type="password" class="form-control" id="password" name="password"
             placeholder="••••••••" required>
    </div>

    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="remember" name="remember">
      <label class="form-check-label small" for="remember">Keep me signed in</label>
    </div>

    <button type="submit" class="btn btn-primary w-100">Sign in</button>
  </form>

  {% if oidc_enabled %}
  <div class="divider text-center position-relative">
    <span class="bg-white px-2 text-muted small" style="position:relative; top:-.7rem;">or</span>
  </div>
  <a href="{{ url_for('auth.oidc_login') }}" class="btn btn-outline-secondary w-100">
    <i class="bi bi-box-arrow-in-right"></i> Sign in with SSO
  </a>
  {% endif %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
