{% extends "base.html" %}
{% block title %}Register — Skerry{% endblock %}
{% block breadcrumb %}Register{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h5 class="mb-0 fw-bold">Register</h5>
  <div class="d-flex gap-2">
    <a href="{{ url_for('exports.export_excel') }}" class="btn btn-sm btn-outline-success">
      <i class="bi bi-file-earmark-excel"></i> Excel
    </a>
  </div>
</div>

<!-- Filters -->
<div class="card shadow-sm mb-3">
  <div class="card-body py-2">
    <form id="filter-form"
          hx-get="{{ url_for('risks.list_risks') }}"
          hx-target="#risk-table-wrapper"
          hx-trigger="change from:select, input from:[name=q] delay:400ms"
          hx-indicator="#spinner"
          class="row g-2 align-items-end">

      <div class="col-md-3">
        <label class="form-label small mb-1">Search</label>
        <input type="text" name="q" class="form-control form-control-sm"
               placeholder="Risk ID, threat, asset, owner…" value="{{ q }}">
      </div>
      <div class="col-md-2">
        <label class="form-label small mb-1">RAG Status</label>
        <select name="rag" class="form-select form-select-sm">
          <option value="">All</option>
          {% for r in ["RED","AMBER","GREEN"] %}
          <option value="{{ r }}" {{ "selected" if rag_filter == r }}>{{ r }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label small mb-1">Category</label>
        <select name="category" class="form-select form-select-sm">
          <option value="">All</option>
          {% for c in risk_categories %}
          <option value="{{ c }}" {{ "selected" if cat_filter == c }}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label small mb-1">Status</label>
        <select name="status" class="form-select form-select-sm">
          <option value="">All</option>
          {% for s in statuses %}
          <option value="{{ s }}" {{ "selected" if status_filter == s }}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label small mb-1">Exceeds Appetite</label>
        <select name="appetite" class="form-select form-select-sm">
          <option value="">All</option>
          <option value="yes" {{ "selected" if appetite_filter == "yes" }}>Yes</option>
          <option value="no" {{ "selected" if appetite_filter == "no" }}>No</option>
        </select>
      </div>
      <div class="col-md-1 d-flex align-items-end">
        <span id="spinner" class="htmx-indicator spinner-border spinner-border-sm text-primary"></span>
      </div>
    </form>
  </div>
</div>

<!-- Table -->
<div id="risk-table-wrapper">
  {% include "partials/risk_table.html" %}
</div>
{% endblock %}
