services:
  web:
    build: .
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-5001}/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:alpine
    ports:
      #- "80:80"
      - "8443:443"
    environment:
      - SERVER_NAME=${SERVER_NAME:-skerry.example.com}
      - PORT=${PORT:-5001}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:    # persists Caddy's CA and issued certs across restarts
  caddy_config:  # persists Caddy's runtime config
